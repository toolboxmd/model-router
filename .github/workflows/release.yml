name: Version release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

concurrency:
  group: version-release-${{ github.repository }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  proof:
    uses: ./.github/workflows/proof.yml

  release:
    needs: proof
    if: github.repository == 'toolboxmd/model-router' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        working-directory: source
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: source

      - name: Check out released version validator
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: toolboxmd/agentsmd
          ref: 298a08830fca7fe5be950af68ac2d41747d674e1 # v12.0.0
          path: release-tools
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Validate and publish exact release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py --versionctl "$GITHUB_WORKSPACE/release-tools/bin/versionctl"

      # Wake Marketplace promotion now instead of waiting for its schedule.
      # The tag is an untrusted hint; Marketplace resolves its own candidate.
      - name: Mint Marketplace-only Toolybara token
        id: toolybara-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TOOLYBARA_CLIENT_ID }}
          private-key: ${{ secrets.TOOLYBARA_PRIVATE_KEY }}
          owner: toolboxmd
          repositories: marketplace
          permission-contents: write

      - name: Dispatch Marketplace reconciliation wake-up
        env:
          GH_TOKEN: ${{ steps.toolybara-token.outputs.token }}
        run: |
          tag="v$(tr -d '[:space:]' < VERSION)"
          payload=$(jq -cn --arg tag "$tag" \
            '{event_type: "module_release_published", client_payload: {release_tag: $tag}}')
          if ! gh api --method POST repos/toolboxmd/marketplace/dispatches --input - <<<"$payload"; then
            echo "::error title=Marketplace wake-up failed::Could not dispatch module_release_published for $tag"
            exit 1
          fi
