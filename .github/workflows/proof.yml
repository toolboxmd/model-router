name: Deterministic proof

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Run complete deterministic proof
        run: |
          python3 scripts/test.py
          python3 -m compileall -q runner scripts tests
